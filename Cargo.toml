[workspace]
resolver = "2"
members = ["crates/*"]
# The Phase 0 spike packages stay outside the workspace as reference code.
exclude = ["spike/exp2"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
ap-core = { path = "crates/ap-core" }
ap-broker = { path = "crates/ap-broker" }
getrandom = "0.2"
hex = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
toml = "0.8"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
