[package]
name = "ap-client"
description = "auth-proxy session-plane client over a Unix socket, for the runtimes that spawn agent sessions (openab-pty, openab). Small dependency set: no HTTP stack, no credential handling."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
ap-core.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
