[package]
name = "ap-proxy"
description = "auth-proxy: the credential-swapping reverse proxy. Loopback agent listener, session-plane and admin Unix sockets, in-process broker."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "auth-proxy"
path = "src/main.rs"

[features]
# Test-only (see ap-core): a build whose policy accepts `connect_to`. The fail-closed
# matrix builds the binary with it; the shipped binary never does.
test-resolve = ["ap-core/test-resolve"]

[dependencies]
ap-core.workspace = true
ap-broker.workspace = true
axum.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
ap-client.workspace = true
# Integration tests spawn the binary, and `cargo test` builds it with this feature.
ap-core = { workspace = true, features = ["test-resolve"] }
hex.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes = "1"
h2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
