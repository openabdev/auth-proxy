[package]
name = "ap-proxy"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "auth-proxy"
path = "src/main.rs"

[dependencies]
ap-core = { workspace = true }
ap-broker = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
ed25519-dalek = "2"
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[features]
default = []
# Test-only, off by default and never enabled in a release build. Lets the black-box matrix trust a
# throwaway CA and resolve mock upstream names (crates/ap-proxy/src/matrix_hooks.rs).
matrix-upstream = []

[[test]]
name = "matrix"
path = "tests/matrix.rs"
required-features = ["matrix-upstream"]

[dev-dependencies]
base64 = "0.22"
getrandom = "0.2"
http-body-util = "0.1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
