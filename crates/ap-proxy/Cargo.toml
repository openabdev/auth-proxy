[package]
name = "ap-proxy"
description = "auth-proxy: the credential-swapping reverse proxy. Loopback agent listener, session-plane and admin Unix sockets, in-process broker."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "auth-proxy"
path = "src/main.rs"

[dependencies]
ap-core.workspace = true
ap-broker.workspace = true
axum.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
ap-client.workspace = true
ap-core.workspace = true
hex.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true
bytes = "1"
h2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
