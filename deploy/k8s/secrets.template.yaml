# Secret templates: names and keys only. No value appears in this file.
# The operator creates each Secret out of band, for example:
#   kubectl -n auth-proxy create secret generic auth-proxy-kiro --from-file=api_key=<path>
#   kubectl -n auth-proxy create secret generic auth-proxy-caller --from-file=caller_key=<path>
# The caller key is the apk_ value the agent presents in the base URL. Its sha256 goes in
# identity-configmap.yaml, so the proxy never stores the raw caller key.
apiVersion: v1
kind: Secret
metadata:
  name: auth-proxy-kiro
  namespace: auth-proxy
type: Opaque
# Mounted into the proxy container only, at /var/run/auth-proxy/secrets/auth-proxy-kiro.
# Key api_key holds the real model API key. Created by the operator.
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-proxy-caller
  namespace: auth-proxy
type: Opaque
# Mounted into the agent container only, read-only, at /var/run/auth-proxy/caller.
# Key caller_key holds the apk_ caller key. Created by the operator.
data: {}
