# Example identity file: Muse as a caller, Discord as the upstream.
#
# This file follows the schema in crates/ap-core/src/config.rs and the layout of
# deploy/k8s/identity-configmap.yaml. Copy it into your deployment, replace the marked values,
# and keep the raw caller key and the bot token out of the file: the config holds only the
# sha256 of the caller key, and the credential is a store reference.
#
# Status of the write path: the POST/PATCH/DELETE grants at the bottom are commented out on
# purpose. Phase 1 policy has only allow/deny, so enabling them today would let the caller
# write immediately. Enable them only together with the require_approval action proposed in
# issue #5, so writes park until the owner approves them. See README.md in this directory.

version = 1

[listen]
proxy = "127.0.0.1:18080"

[[identity]]
name = "muse"
# Placeholder only -- no real or example digest is committed here. REPLACE
# with the sha256 of your own generated caller key (see README.md,
# "Generating keys"); the raw key (apk_...) is held by the caller only.
caller_key_sha256 = "<CALLER_KEY_SHA256_HEX>"
# runtime_pubkey = "..."  # base64 Ed25519 public key of the registrar that opens sessions for
# this identity. For Muse the registrar is a component on the owner's device (issue #6). Hello
# is refused until this is set.

[[route]]
name = "discord"
host = "discord.com"
# port, error_shape, surrogate_header and credential_header keep their defaults:
# 443, generic, "authorization" and "authorization".
# Known gap: the forwarder always sets the credential header as "Bearer <secret>"
# (crates/ap-proxy/src/forward.rs), but Discord bot tokens must be sent as "Bot <token>".
# A live Discord pilot needs a per-route credential scheme; see README.md, "Known gap".

[[credential]]
id = "discord-bot"
# Store reference for the bot token, in the same syntax as the kiro example: the file-backed
# store resolves k8s:<name>:<key> to the token material on the proxy host. The token itself
# never appears in this file and is never sent to the caller.
source = "k8s:auth-proxy-discord:bot_token"
routes = ["discord"]

# Reads: allowed. Path entries ending in "/" are prefixes (crates/ap-core/src/config.rs);
# "/api/v10/channels/" covers channel reads and message history.
[[grant]]
identity = "muse"
credential = "discord-bot"
route = "discord"
methods = ["GET"]
paths = ["/api/v10/channels/", "/api/v10/guilds/"]

# Writes: DO NOT enable before require_approval (issue #5) exists, unless you accept that
# matching requests execute immediately.
#
# A narrow create-message grant is NOT expressible in Phase 1 -- do not try
# the obvious shape. Config validation (crates/ap-core/src/config.rs,
# valid_path) rejects any non-root grant path that does not end in "/", so
# the exact create-message path cannot be granted at all; and the prefix
# form "/api/v10/channels/<id>/messages/" can never match it either,
# because Policy::evaluate is a raw starts_with (crates/ap-core/src/
# policy.rs) and the create-message path "/api/v10/channels/<id>/messages"
# has no trailing slash. That prefix would silently authorize only
# sub-paths -- creating a thread from a message, crossposting -- i.e. it
# allows everything EXCEPT the one write this example documents.
# test_policy.py pins this down mechanically.
#
# The only Phase 1 grant that authorizes create-message today is the
# whole-channel prefix below. Its blast radius is the entire channel: for
# the granted methods it covers posting, editing, deleting, threads, pins,
# reactions and every other operation under /api/v10/channels/<id>/.
# Two of those deserve explicit notice:
#   * The proxy cannot see message authorship. DELETE under this prefix
#     removes ANY user's message when the bot holds Discord's Manage
#     Messages permission; only Discord's own rules limit PATCH to the
#     bot's own messages. Until matching is tightened, the real limit is
#     the bot's Discord-side permissions -- grant it no Manage Messages.
#   * Replies use the same create endpoint with a message_reference in
#     the JSON body; the policy layer cannot see the body, which is
#     exactly what the approval step (#5) would review.
#
# Recommendation: leave writes disabled. Narrow write grants need
# exact-path or segment-boundary matching in ap-core -- a separate core
# follow-up, like the per-route credential scheme, and not something this
# example can fix from the config side.
#
# [[grant]]
# identity = "muse"
# credential = "discord-bot"
# route = "discord"
# methods = ["POST", "PATCH", "DELETE"]
# paths = ["/api/v10/channels/1111111111111111111/"]  # REPLACE with the channel id; whole-channel prefix -- see blast radius above
