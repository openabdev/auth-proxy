[package]
name = "ap-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "auth-proxy Phase 0 / Experiment 2: option A (Rust proxy) and option B's ext_authz service, sharing one admission core"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ap-proxy"
path = "src/bin/ap_proxy.rs"

[[bin]]
name = "ap-authz"
path = "src/bin/ap_authz.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
